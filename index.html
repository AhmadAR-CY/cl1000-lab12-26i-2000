<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Student ID Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card-ahmad">
        <div id="card-header">
            <h1>FAST-NUCES</h1>
            <p>Student ID Card</p>
        </div>

        <div class="card-body">
            <img id="photo" src="images/me.jpg" alt="Dummy student profile photo">

            <div class="info-row">
                <span class="label">Name</span>
                <span class="value">Ahmad Khan</span>
            </div>
            <div class="info-row">
                <span class="label">Roll Number</span>
                <span class="value">26i-1230</span>
            </div>
            <div class="info-row">
                <span class="label">Degree</span>
                <span class="value">BS Cyber Security</span>
            </div>
            <div class="info-row">
                <span class="label">Section</span>
                <span class="value">CY-A</span>
            </div>
            <div class="info-row">
                <span class="label">Campus</span>
                <span class="value">Islamabad</span>
            </div>
        </div>

        <div id="card-footer">
            <p>Valid for Fall 2026</p>
            <p class="motto">Learn, Explore, Achieve</p>
        </div>
    </div>
</body>
</html>
